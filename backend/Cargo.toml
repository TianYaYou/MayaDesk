[package]
name = "mayadesk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MayaDesk P2P-first multi-disk NAS cloud drive server with Cloudflare Tunnel fallback"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
uuid.workspace = true
chrono.workspace = true

# Web & Signaling Server
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }

# Database & Multi-Disk VFS Storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
opendal = { version = "0.50", features = ["services-fs", "services-s3", "services-webdav"] }

# Auth (Email/Password Argon2 + Google OAuth2 + JWT)
argon2 = "0.5"
jsonwebtoken = "9.3"
oauth2 = "4.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# P2P Engine (WebRTC DataChannel & STUN/ICE Signaling)
webrtc = "0.11"
dotenvy = "0.15"
