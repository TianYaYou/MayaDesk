[package]
name = "mayadesk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MayaDesk P2P-first multi-disk NAS cloud drive server with Cloudflare Tunnel fallback"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
uuid.workspace = true
chrono.workspace = true

# Web, Static File Serving & WebSocket Signaling Server
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
tokio-util = { version = "0.7", features = ["io"] }

# Database & Multi-Disk VFS Storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Auth (Email/Password Argon2 + Google OAuth2 + JWT)
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Config & Environment
toml = "0.8"
dotenvy = "0.15"

# Compression / Folder download
zip = { version = "2.2", default-features = false, features = ["deflate"] }
